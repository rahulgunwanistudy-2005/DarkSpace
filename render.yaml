services:
  - type: web
    runtime: static
    name: darkspace-fixture
    repo: https://github.com/rahulgunwanistudy-2005/DarkSpace
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run prepare:web && npm run build
    staticPublishPath: web/build
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VITE_DARKSPACE_BUNDLE
        value: fixture
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    routes:
      - type: rewrite
        source: /methods
        destination: /methods.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "connect-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
      - path: /_app/immutable/workers/*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'"
      - path: /models/*
        name: Cache-Control
        value: no-cache
