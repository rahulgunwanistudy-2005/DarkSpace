[project]
name = "darkspace"
version = "0.1.0"
description = "Reproducible public forecasts for Dark Space"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
darkspace = "darkspace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["darkspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
