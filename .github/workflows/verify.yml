name: Fixture verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.23
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: uv run --locked darkspace fixtures --config configs/fixture.yaml
      - run: uv run --locked darkspace export fixture --run data/runs/fixture-d14769c6fc4b987ec90459e808ac6c0bb3539e68e933019bc007fab5395e0c9b/bundle.json
      - run: git diff --exit-code -- data/fixtures data/runs web/static/data/current.json
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check darkspace tests scripts
      - run: uv run --with numpy==2.5.4 --with scikit-learn==1.9.1 --with umap-learn==0.5.12 mypy --strict darkspace
      - run: npm test
      - run: npm run check:core
      - run: npm run check:web
      - run: npm run assets:placement
      - run: npm run verify:embedding
      - run: npm run prepare:web
      - run: npm run build
      - run: node scripts/verify-public-build.mjs
      - run: python scripts/check-data-safety.py --tracked --history --public-bundle
